[project]
name = "prior-weighted-partner-average"
version = "0.1.0"
description = "Predict unmeasured gene knockdowns as a prior-weighted average of measured ones"
license = "BSD-3-Clause"
requires-python = ">=3.12,<3.13"
# pinned to the environment that produced the results (ORCD rotation_project/txpert-baseline/.venv, Python 3.12.15);
# entmax is not in it (the original fit computed entmax-1.5 itself), so it takes the package's current release
dependencies = [
    "anndata==0.11.4",
    "entmax==1.3",
    "ipykernel==6.29.5",
    "matplotlib==3.10.1",
    "nbconvert==7.17.2",  # runs the notebooks headless: jupyter nbconvert --execute
    "scikit-misc==0.5.3",  # scanpy's seurat_v3 highly variable genes (0.datasets/2.process_perturbseq.ipynb)
    "numpy==1.26.4",
    "pandas==2.2.3",
    "pyarrow==19.0.1",
    "scanpy==1.11.1",
    "scipy==1.15.2; sys_platform == 'linux'",
    "scipy==1.16.3; sys_platform == 'darwin'",  # 1.15's macOS wheels fail to load on macOS 27 (__thread_bss)
    "torch==2.6.0",
]

[tool.uv]
package = false
